name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :logic:test

      # Gradle's test task passes trivially when it finds nothing to run, so a green
      # check would otherwise be meaningless. Count the actual cases and print the total.
      - name: Verify tests actually ran
        run: |
          count=$(cat logic/build/test-results/test/*.xml | grep -o '<testcase ' | wc -l)
          echo "Executed tests: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No tests executed - refusing to report a green build."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dawn-swap-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: logic/build/test-results/test/*.xml
